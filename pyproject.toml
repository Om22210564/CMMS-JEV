[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmms-jev"
version = "0.1.0"
description = "Terminal-first CMMS semantic decision prototype using TypeSafe AI Jev"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "typesafe-sdk",
]

[project.scripts]
cmms-jev = "cmms_jev.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
